name: immich

services:
  immich:
    container_name: immich
    # CHANGEMENT 1: Version intermédiaire v1.132.3 pour la migration du schéma
    image: ghcr.io/immich-app/immich-server:v1.132.3
    volumes:
      - $IMMICH_VOL_UPLOAD:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - /mnt/RAID1_22TB/maison:/mnt/RAID1_22TB/maison
    ports:
      - $IMMICH_PORT:2283
    networks:
      - proxy
      - internal
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # CHANGEMENT 2: Version intermédiaire v1.132.3 pour correspondre au serveur
    image: ghcr.io/immich-app/immich-machine-learning:v1.132.3
    volumes:
      - model-cache:/cache
    networks:
      - internal
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/redis:7.4.10@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    networks:
      - internal
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
    environment:
      POSTGRES_PASSWORD: $IMMICH_DB_PASSWORD
      POSTGRES_USER: $IMMICH_DB_USERNAME
      POSTGRES_DB: $IMMICH_DB_DATABASE_NAME
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - $IMMICH_DB_VOL_DATA:/var/lib/postgresql/data
    networks:
      - internal
    restart: always

volumes:
  model-cache:
  
networks:
  proxy:
    external: true
  internal:
    external: false   
