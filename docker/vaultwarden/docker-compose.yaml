services:
  vaulwarde:
    container_name: vaultwarden
    image: vaultwarden/server:1.37.1@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8
    ports:
      - $VAULTWARDEN_PORT:80
    networks:
      - proxy
    environment:
      - DOMAIN=$VAULTWARDEN_URL
      - SIGNUPS_ALLOWED=$VAULTWARDEN_SIGNUP_ALLOWED
    volumes:
      - $VAULTWARDEN_VOL_DATA:/data
    restart: unless-stopped

networks:
  proxy:
    external: true
