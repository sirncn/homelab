services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
    container_name: gluetun
    ports:
      - $TRANSMISSION_VPN_PORT:9091
      - $DISPATCHARR_PORT:9191
    networks:
      - proxy
      - internet
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - $TRANSMISSION_VPN_VOL_DATA:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=$TRANSMISSION_VPN_PROVIDER
      - OPENVPN_USER=$TRANSMISSION_VPN_USER
      - OPENVPN_PASSWORD=$TRANSMISSION_VPN_PASSWORD
      - SERVER_REGIONS=$TRANSMISSION_VPN_REGION
      - PRIVATE_INTERNET_ACCESS_VPN_PORT_FORWARDING=on
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTPPROXY=off
      - FIREWALL_INPUT_PORTS=9091,9191
    restart: unless-stopped
  transmission:
    image: linuxserver/transmission:163@sha256:7500fe2cc34a52da2dbf9a51246a4dc0eb66611c538765d9ca08447e5b49a0d0
    container_name: transmission
    restart: unless-stopped
    environment:
      - PUID=$TRANSMISSION_PUID
      - PGID=$TRANSMISSION_PGID
      - TZ=$TRANSMISSION_TZ
    volumes:
      - $TRANSMISSION_VOL_CONFIG:/config
      - $TRANSMISSION_VOL_INIT:/custom-cont-init.d:ro
      - $TRANSMISSION_VOL_DOWNLOADS:/downloads
      - $TRANSMISSION_VOL_MEDIAS:/mnt/medias
    depends_on: 
      - gluetun
    network_mode: "service:gluetun"
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.28.2@sha256:3eb0ec779f3437ec64c08a9b3f545a355a8f512f3740cdeaac42b80f1021637d
    container_name: dispatcharr
    restart: unless-stopped
    volumes:
      - $DISPATCHARR_VOL_DATA:/data
    environment:
      - DISPATCHARR_ENV=$DISPATCHARR_ENV
      - REDIS_HOST=$DISPATCHARR_REDIS_HOST
      - CELERY_BROKER_URL=$DISPATCHARR_CELERY_BROKER_URL
      - DISPATCHARR_LOG_LEVEL=$DISPATCHARR_LOG_LEVEL
    depends_on: 
      - gluetun
    network_mode: "service:gluetun"

networks:
  proxy:
    external: true
  internet:
    external: true
