services:
  gotify:
    image: gotify/server:2.9.1@sha256:a3af47067ce6aad76aadf5ba32d6ddfecd1ae576a961359f039fd1831e8b7652
    container_name: gotify
    restart: unless-stopped
    ports:
      - $GOTIFY_PORT:80
    environment:
      - TZ=$GOTIFY_TZ
      - GOTIFY_DEFAULTUSER_PASS=$GOTIFY_DEFAULTUSER_PASS
    volumes:
      - $GOTIFY_VOL_DATA:/app/data
